name: Build

on: [push]

jobs:
        build:
                runs-on: ${{ matrix.os }}

                strategy:
                        matrix:
                                os:
                                        [
                                                ubuntu-latest,
                                                windows-latest,
                                                macos-latest,
                                        ]

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies (Windows)
                          if: runner.os == 'Windows'
                          id: sdl
                          uses: libsdl-org/setup-sdl@main
                          with:
                                  version: 2-latest

                        - name: Configure SDL2 paths (Windows)
                          if: runner.os == 'Windows'
                          shell: bash
                          run: |
                                  echo "CPATH=${{ steps.sdl.outputs.prefix }}/include" >> "$GITHUB_ENV"
                                  echo "LIBRARY_PATH=${{ steps.sdl.outputs.prefix }}/lib" >> "$GITHUB_ENV"
                                  echo "${{ steps.sdl.outputs.prefix }}/bin" >> "$GITHUB_PATH"

                        - name: Install dependencies (Linux)
                          if: runner.os == 'Linux'
                          run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libx11-dev build-essential libsdl2-dev

                        - name: Install dependencies (macOS)
                          if: runner.os == 'macOS'
                          run: brew install sdl2

                        - name: Build
                          run: make

        msdos:
                runs-on: ubuntu-latest

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies
                          run: sudo apt-get update && sudo apt-get install -y build-essential make wget

                        - name: Install Open Watcom
                          run: |
                                  wget -q https://github.com/open-watcom/open-watcom-v2/releases/download/Last-CI-build/ow-snapshot.tar.xz -O /tmp/openwatcom.tar.xz
                                  sudo mkdir -p /opt/watcom
                                  sudo tar -xf /tmp/openwatcom.tar.xz -C /opt/watcom

                        - name: Build
                          run: |
                                  export WATCOM=/opt/watcom
                                  export PATH="$WATCOM/binl64:$WATCOM/binl:$PATH"
                                  make -f Makefile.wat
