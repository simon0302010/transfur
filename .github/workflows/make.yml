name: Build

on: [push]

jobs:
        build:
                runs-on: ${{ matrix.os }}

                strategy:
                        matrix:
                                os:
                                        [
                                                ubuntu-latest,
                                                windows-latest,
                                                macos-latest,
                                        ]

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies (Linux)
                          if: runner.os == 'Linux'
                          run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libx11-dev build-essential

                        - name: Install dependencies (macOS)
                          if: runner.os == 'macOS'
                          run: brew install sdl2

                        - name: make
                          run: make
