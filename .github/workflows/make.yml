name: Build

on: [push]

jobs:
        build:
                runs-on: ${{ matrix.os }}

                strategy:
                        matrix:
                                os:
                                        [
                                                ubuntu-latest,
                                                windows-latest,
                                                macos-latest,
                                        ]

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies (Linux)
                          if: runner.os == 'Linux'
                          run: sudo apt update && sudo apt install -y build-essential cmake pkg-config libbluetooth-dev libsdl3-dev

                        - name: make
                          run: make
