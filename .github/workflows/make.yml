name: Build

on: [push]

jobs:
        build:
                runs-on: ${{ matrix.os }}

                strategy:
                        matrix:
                                os:
                                        [
                                                ubuntu-latest,
                                                windows-latest,
                                                macos-latest,
                                        ]

                steps:
                        - uses: actions/checkout@v4

                        - uses: libsdl-org/setup-sdl@main
                          with:
                                  version: 3-latest
                                  install-linux-dependencies: true

                        - name: Install dependencies (Linux)
                          if: runner.os == 'Linux'
                          run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev

                        - name: make
                          run: make
