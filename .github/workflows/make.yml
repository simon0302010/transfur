name: Build

on: [push]

jobs:
        build:
                runs-on: ${{ matrix.os }}

                strategy:
                        matrix:
                                os:
                                        [
                                                ubuntu-latest,
                                                windows-latest,
                                                macos-latest,
                                        ]

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies (Windows)
                          if: runner.os == 'Windows'
                          uses: libsdl-org/setup-sdl@main
                          with:
                                  version: 2-latest

                        - name: Install dependencies (Linux)
                          if: runner.os == 'Linux'
                          run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libx11-dev build-essential libsdl2-dev

                        - name: Install dependencies (macOS)
                          if: runner.os == 'macOS'
                          run: brew install sdl2

                        - name: make
                          run: make
        msdos:
                runs-on: ubuntu-latest

                steps:
                        - uses: actions/checkout@v4

                        - name: Install dependencies
                          run: sudo apt-get update && sudo apt-get install -y build-essential

                        - name: Install Open Watcom
                          run: |
                                  wget -q https://github.com/open-watcom/open-watcom-v2/releases/download/Last-CI-build/ow-snapshot.tar.xz -O /tmp/openwatcom.tar.xz
                                  sudo mkdir -p /opt/watcom
                                  sudo tar -xf /tmp/openwatcom.tar.xz -C /opt/watcom

                        - name: make
                          env:
                                  WATCOM: /opt/watcom
                                  PATH: /opt/openwatcom/binl64:/opt/openwatcom/binl:$PATH
                          run: make -f Makefile.wat
